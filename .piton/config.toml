[sandbox]
allow = [
    "$HOME/Library/Caches/org.swift.swiftpm"
]
read = [
    "$HOME/Library/org.swift.swiftpm/security",
    "$HOME/.local/state/piton/logs"
]
read_file = [
    "$HOME/Library/Preferences/com.apple.dt.Xcode.plist",
    "$HOME/Library/Developer/Xcode/SDKToSimulatorIndexMapping.plist",
    "$HOME/.local/state/piton/piton.log",
    "$HOME/.local/state/piton/launchd.log"
]

[workers]
skip = ["apps/.build/index-build"]

[permissions]
deny = [
    "read(*mise.local.toml)"
]
allow = [
    "mcp(github, hint: readOnly)",
    "mcp(github, projects_write)",
    "mcp(github, issue_write)",
    "mcp(github, add_issue_comment)",
    "mcp(github, update_issue_comment)"
]

[branches]
format = "identifier-title"

[tracker]
provider = "github"
mcp_server = "github"
repository = { owner = "alex35mil", repo = "piton" }
project = { owner = "alex35mil", owner_type = "user", number = 2 }

[tracker.labels.groups.kind]
applies_to = ["epic", "deliverable"]
cardinality = "exactlyOne"

[tracker.labels.groups.kind.values.epic]
name = "Kind: Epic"
color = "#8250DF"
description = "A multi-deliverable initiative."

[tracker.labels.groups.kind.values.feature]
name = "Kind: Feature"
color = "#0969DA"
description = "New user-visible or system capability."

[tracker.labels.groups.kind.values.bugfix]
