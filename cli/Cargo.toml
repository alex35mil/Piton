[package]
name = "piton"
version = "0.1.0"
edition = "2024"
rust-version = "1.99"
description = "Daemon and CLI that own pi coding agent processes and let several clients attach"
license = "MIT"
publish = false

[[bin]]
name = "piton"
path = "src/main.rs"

[dependencies]
base64 = "0.23.1"
futures-util = "0.3.34"
libc = "0.2.191"
nix = { version = "0.31", features = ["fs", "net", "signal", "user"] }
nono = { version = "0.82", default-features = false }
notify = "8"
regex-lite = "0.1.8"
rusqlite = { version = "0.42.0", features = ["bundled"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = { version = "1.0.154", features = ["preserve_order"] }
thiserror = "2.0.21"
tokio = { version = "1.54.1", features = ["full"] }
tokio-tungstenite = "0.30.0"
toml = { version = "1.2.1", features = ["preserve_order"] }
toml_edit = "0.25"
tree-sitter = "0.27"
tree-sitter-bash = "0.25.1"
usage-rs = { version = "7", features = ["completions"] }

[lints.rust]
# Denied everywhere; the one exception (clonefile(2) in worker.rs) is allowed locally with a SAFETY comment.
unsafe_code = "deny"

[lints.clippy]
wildcard_enum_match_arm = "deny"
match_wildcard_for_single_variants = "deny"

[dev-dependencies]
regex-lite = "0.1.8"
tempfile = "3.27.0"
